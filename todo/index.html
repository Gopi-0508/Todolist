<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>3D Todo App</title>

    <!-- CSS File -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- 3D Background -->

    <div class="orb"></div>

    <!-- Main Container -->

    <div class="container">

        <!-- Header -->

        <div class="header">

            <h1>🚀 To-Do List</h1>

            <!-- Theme Buttons -->

            <div class="theme-buttons">

                <button
                class="theme-btn green"
                onclick="changeTheme('default')">
                </button>

                <button
                class="theme-btn purple"
                onclick="changeTheme('theme2')">
                </button>

                <button
                class="theme-btn cyan"
                onclick="changeTheme('theme3')">
                </button>

                <button
                class="theme-btn red"
                onclick="changeTheme('theme4')">
                </button>

            </div>

        </div>

        <!-- 3D Logo -->

        <img
        src="https://cdn-icons-png.flaticon.com/512/4697/4697260.png"
        class="logo">

        <!-- Input Section -->

        <div class="input-section">

            <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="Enter task">

            <input
            type="date"
            id="dateInput"
            class="date-input">

            <select
            id="priorityInput"
            class="priority-input">

                <option>High</option>

                <option selected>
                    Medium
                </option>

                <option>Low</option>

            </select>

            <button
            class="add-btn"
            onclick="addTask()">

            Add

            </button>

        </div>

        <!-- Filter Buttons -->

        <div class="filters">

            <button
            class="filter-btn"
            onclick="filterTasks('all')">

            All

            </button>

            <button
            class="filter-btn"
            onclick="filterTasks('completed')">

            Completed

            </button>

            <button
            class="filter-btn"
            onclick="filterTasks('pending')">

            Pending

            </button>

        </div>

        <!-- Task List -->

        <div id="taskList"></div>

    </div>

    <!-- JavaScript File -->

    <script src="script.js"></script>

</body>
</html>
